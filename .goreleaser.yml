# GoReleaser configuration for pg-squash Engine
#
# Uses goreleaser-cross for robust CGO cross-compilation to all platforms.
# goreleaser-cross includes pre-built toolchains for Linux, macOS, and Windows.
#
# Supported platforms:
# - Linux: AMD64, ARM64
# - macOS: AMD64 (Intel), ARM64 (Apple Silicon)
# - Windows: AMD64, ARM64 (future)
#
# Requirements:
# - goreleaser-cross distribution (set in GitHub Actions)
# - CGO enabled for all builds (required by pg_query_go)
# - Docker with QEMU for multi-platform support
version: 2

before:
  hooks:
    # Run tests before building
    - go test -v ./...
    - go mod tidy

builds:
  # Linux AMD64
  - id: linux-amd64
    main: ./cmd/pgsquash
    binary: pgsquash
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'

  # Linux ARM64
  - id: linux-arm64
    main: ./cmd/pgsquash
    binary: pgsquash
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'

  # macOS AMD64 (Intel)
  - id: darwin-amd64
    main: ./cmd/pgsquash
    binary: pgsquash
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'

  # macOS ARM64 (Apple Silicon)
  - id: darwin-arm64
    main: ./cmd/pgsquash
    binary: pgsquash
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: pgsquash-archive
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    ids:
      - linux-amd64
      - linux-arm64
      - darwin-amd64
      - darwin-arm64
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docker/README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  use: github
  sort: asc
  abbrev: 7
  groups:
    - title: 🚀 Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 🐛 Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 📚 Documentation
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 🔧 Performance & Refactors
      regexp: '^.*?(perf|refactor)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: 🧪 Tests & CI
      regexp: '^.*?(test|ci)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: 📦 Dependencies
      regexp: '^.*?(build|deps?)(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^style:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: capysquash
    name: pg-squash
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## pg-squash Engine {{ .Version }}

    **Release Date**: {{ .Date }}

    ### Supported Platforms

    This release includes native binaries for:
    - **Linux**: AMD64 (x86_64), ARM64 (aarch64)
    - **macOS**: AMD64 (Intel), ARM64 (Apple Silicon)

    ### Installation

    #### Homebrew (macOS & Linux)
    ```bash
    # Coming soon
    # brew install capysquash/tap/pgsquash
    ```

    #### Go Install
    ```bash
    go install github.com/capysquash/pg-squash-engine/cmd/pgsquash@{{ .Tag }}
    ```

    #### Docker
    ```bash
    # GitHub Container Registry
    docker pull ghcr.io/capysquash/pgsquash:{{ .Version }}

    # Docker Hub
    docker pull pgsquash/pgsquash:{{ .Version }}
    ```

    #### Manual Installation
    Download the appropriate binary for your platform below.

  footer: |
    ---

    **Full Changelog**: https://github.com/capysquash/pg-squash-engine/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## 🐳 Docker Images

    Multi-platform Docker images are available:

    ```bash
    # GitHub Container Registry
    docker pull ghcr.io/capysquash/pgsquash:{{ .Version }}
    docker pull ghcr.io/capysquash/pgsquash:latest

    # Docker Hub
    docker pull pgsquash/pgsquash:{{ .Version }}
    docker pull pgsquash/pgsquash:latest
    ```

    ## 📦 Checksums

    See `checksums.txt` for SHA256 checksums of all artifacts.

    ## 🆘 Support

    - 📖 [Documentation](https://github.com/capysquash/pg-squash-engine)
    - 🐛 [Report Issues](https://github.com/capysquash/pg-squash-engine/issues)
    - 💬 [Discussions](https://github.com/capysquash/pg-squash-engine/discussions)

